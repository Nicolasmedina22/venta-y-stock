<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ NOMBRE_APP }} - Iniciar sesión</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-screen">
  <div class="login-card">
    <div class="login-icon">🔧</div>
    <h1 class="login-title">{{ NOMBRE_APP }}</h1>
    <p class="login-subtitle">Sistema de punto de venta multiusuario</p>

    <form method="POST" action="{{ url_for('login') }}" class="login-form">
      <div class="form-group">
        <input 
          type="text" 
          name="usuario" 
          class="form-control" 
          placeholder="Usuario" 
          required 
          autofocus
        >
      </div>

      <div class="form-group">
        <input 
          type="password" 
          name="password" 
          class="form-control" 
          placeholder="Contraseña" 
          required
        >
      </div>

      <div class="login-error">
        {% if error %}
          {{ error }}
        {% endif %}
      </div>

      <button type="submit" class="btn btn-primary" style="height: 38px; width: 100%; margin-top: 6px;">
        Ingresar
      </button>
    </form>

    <div style="font-size: 10px; color: var(--text-dim); margin-top: 30px;">
      v{{ VERSION_APP }}
    </div>
  </div>
</body>
</html>
