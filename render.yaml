# Blueprint de Render (render.com). Despliegue en un clic desde el repositorio.
#
#   1. Sube el proyecto a GitHub (la base de datos y build/ NO se suben, lo
#      encarga .gitignore).
#   2. En Render: New -> Blueprint -> apunta a tu repositorio.
#   3. Render te pedira completar las variables marcadas como "sync: false".
#
# La base de datos NO se crea desde este archivo: el proyecto usa Neon
# (PostgreSQL gratuito sin caducidad). La cadena de conexion se pega en el
# panel, porque guardarla en el repositorio publicaria la contrasena.
#
# Detalle: el plan "free" de PostgreSQL de Render caduca a los 30 dias. Para
# un negocio en produccion usa Neon (ver DEPLOY.md).

services:
  - type: web
    name: venta-y-stock
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python serve.py
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: HOSTED_MODE
        value: "1"
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: DATABASE_URL
        sync: false
